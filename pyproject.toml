[project]
name = "whats-up-spearfish"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "feedparser",
    "icalendar",
    "Jinja2",
    "python-slugify",
    "python-dotenv",
    "pytailwindcss",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9.0.post0",
    "pillow>=12.2.0",
    "usaddress-scourgify>=0.7.1",
    "shapely>=2.2.0",
    "pyarrow>=26.0.0",
    "cpi>=2.1.0",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "pytest>=8.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives the built site in headless Chromium (tests/test_browser.py)"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
