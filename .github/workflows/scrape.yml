name: Scrape, build and deploy

on:
  schedule:
    - cron: "15 12 * * *"   # daily tier — 6:15 AM MDT / 5:15 AM MST
    - cron: "10 1-22/3 * * *"  # frequent tier (creek gauge, fire, alerts) — every 3 hours; the 07:10 UTC
                                #   run lands just after midnight Mountain time, so dates roll over promptly
  push:
    branches: [main]        # code changes: rebuild and deploy, no scrape
  workflow_dispatch:
    inputs:
      tier:
        description: Which sources to scrape before building
        type: choice
        options: [daily, frequent, all, none]
        default: daily

concurrency:
  group: scrape-deploy
  cancel-in-progress: false  # never kill a scrape midway; queue instead

jobs:
  run:
    # Pinned: Playwright can't install Chromium on ubuntu-26.04 (ubuntu-latest) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: github-pages
    permissions:
      contents: write   # push to the data branch
      pages: write
      id-token: write
      issues: write     # scraper health issue

    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      # GitHub's schedules are best-effort: runs are sometimes late or dropped
      # entirely (2026-11-02 lost both the 09:45 and 12:15 UTC runs). So any
      # scheduled run upgrades itself to the daily tier when the last daily
      # scrape is more than 20 hours old, and the daily slot steps down to the
      # frequent tier if a catch-up daily already ran in the past 6 hours.
      - name: Pick tier
        id: tier
        run: |
          last=$(cat data/_last_daily 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tier="${{ inputs.tier }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            tier="none"
          elif [ "$age" -gt $(( 20 * 3600 )) ]; then
            tier="daily"
          elif [ "${{ github.event.schedule }}" = "15 12 * * *" ] && [ "$age" -gt $(( 6 * 3600 )) ]; then
            tier="daily"
          else
            tier="frequent"
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: $tier (last daily scrape $(( age / 3600 ))h ago)"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Install Chromium (browser sources)
        if: steps.tier.outputs.tier == 'daily' || steps.tier.outputs.tier == 'all'
        run: uv run playwright install --with-deps chromium

      - name: Install Tesseract (reads Sawyer's tap list images)
        if: steps.tier.outputs.tier == 'daily' || steps.tier.outputs.tier == 'all'
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Scrape
        if: steps.tier.outputs.tier != 'none'
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          case "${{ steps.tier.outputs.tier }}" in
            all) uv run python -m scrapers ;;
            *)   uv run python -m scrapers --tier "${{ steps.tier.outputs.tier }}" ;;
          esac
          case "${{ steps.tier.outputs.tier }}" in
            daily|all) date +%s > data/_last_daily ;;
          esac

      - name: Commit data
        if: steps.tier.outputs.tier != 'none'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -q -m "data: ${{ steps.tier.outputs.tier }} scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin data && git push -q origin HEAD:data && exit 0
            sleep 5
          done
          exit 1

      - name: Update scraper health issue
        if: steps.tier.outputs.tier != 'none'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/health_issue.py data/_health.json

      - name: Build site
        run: uv run python -m sitegen --data data --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
