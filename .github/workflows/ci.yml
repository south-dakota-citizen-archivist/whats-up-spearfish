name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # Same as scrape.yml: Playwright can't install Chromium on newer Ubuntu images yet
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run tests (including the site in a headless browser, with accessibility checks)
        run: uv run pytest
